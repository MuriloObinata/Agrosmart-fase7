name: CI AgroSmart (DevSecOps)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualidade:
    name: Qualidade de código (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Análise estática (ruff)
        run: ruff check src tests

  testes:
    name: Testes automatizados (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Rodar testes
        run: pytest -v

  seguranca:
    name: Segurança (Bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Análise de segurança do código (Bandit, severidade média ou alta)
        run: bandit -r src -ll
      - name: Vulnerabilidades nas dependências (pip-audit)
        run: pip-audit -r requirements.txt

  docker:
    name: Build, execução em container e scan de imagem
    runs-on: ubuntu-latest
    needs: [qualidade, testes, seguranca]
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t agrosmart:latest .

      - name: Subir plataforma com docker compose
        env:
          CICLO_S: "10"
        run: |
          mkdir -p data/raw data/trusted data/refined logs relatorios
          chmod -R 777 data logs relatorios
          docker compose up -d --no-build

      - name: Aguardar pipeline ficar saudável (healthcheck)
        run: |
          for i in $(seq 1 24); do
            estado=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q pipeline)")
            echo "tentativa $i: pipeline=$estado"
            [ "$estado" = "healthy" ] && exit 0
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Evidências da execução (status e logs)
        run: |
          sleep 15
          docker compose ps
          cat logs/status.json
          tail -n 20 logs/agrosmart.log
          test -s data/refined/leituras_analisadas.csv

      - name: Análise de processo dentro do container
        run: docker compose --profile analise run --rm mineracao

      - name: Guardar evidências como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-execucao
          path: |
            logs/
            relatorios/
            data/refined/

      - name: Desligar
        if: always()
        run: docker compose down

      # Trivy fixado em commit (SHA): em março/2026 tags do trivy-action foram comprometidas
      # (CVE-2026-33634). Fixar o SHA evita usar uma tag adulterada.
      - name: Vulnerabilidades da imagem (relatório HIGH e CRITICAL)
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          image-ref: agrosmart:latest
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          version: v0.69.3

      - name: Bloquear se houver vulnerabilidade CRITICAL com correção
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          image-ref: agrosmart:latest
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          version: v0.69.3
